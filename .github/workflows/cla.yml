name: CLA Assistant

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla-check:
    runs-on: ubuntu-latest
    steps:
      - name: CLA Assistant
        if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PERSONAL_ACCESS_TOKEN: ${{ secrets.CLA_TOKEN }}
        with:
          path-to-signatures: 'signatures/version1/cla.json'
          path-to-document: 'https://github.com/${{ github.repository }}/blob/main/CLA.md'
          # Signatures live on a dedicated unprotected branch: the action writes
          # the file directly, and protected `main` rejected it ("Changes must be
          # made through a pull request") on PR #21.
          branch: 'cla-signatures'
          # ht-cto-agent is Happy Technologies' own coding agent (commits as
          # coding-worker@happy-tech.biz), covered like dependabot.
          allowlist: 'bot*,dependabot*,ht-cto-agent'
          custom-notsigned-prcomment: >
            Thank you for your contribution! Before we can merge this PR, you need
            to sign our Contributor License Agreement (CLA). Please read the
            [CLA document](https://github.com/${{ github.repository }}/blob/main/CLA.md)
            and comment below with: **I have read the CLA Document and I hereby sign the CLA**
          custom-pr-sign-comment: 'I have read the CLA Document and I hereby sign the CLA'
