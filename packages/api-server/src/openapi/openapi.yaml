                    type: integer
                  total_relationships:
                    type: integer
                  active_discovery_jobs:
                    type: integer
                  recent_anomalies:
                    type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'

  /analytics/ci-counts:
    get:
      tags: [Analytics]
      summary: CI counts by type
      operationId: getCICountsByType
      responses:
        '200':
          description: CI type counts
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    type:
                      $ref: '#/components/schemas/CIType'
                    count:
                      type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'

  /analytics/discovery-stats:
    get:
      tags: [Analytics]
      summary: Discovery statistics
      description: Get discovery job statistics
      operationId: getDiscoveryStats
      parameters:
        - name: _start_date
          in: query
          schema:
            type: string
            format: date-time
        - name: _end_date
          in: query
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: Discovery statistics
          content:
            application/json:
              schema:
                type: object
                properties:
                  total_jobs:
                    type: integer
                  successful_jobs:
                    type: integer
                  failed_jobs:
                    type: integer
                  cis_discovered:
                    type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'

  # =============================================================================
  # ANOMALIES
  # =============================================================================
  /anomalies/recent:
    get:
      tags: [Anomalies]
      summary: Get recent anomalies
      description: Retrieve recently detected anomalies
      operationId: getRecentAnomalies
      parameters:
        - name: hours
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 168
            default: 24
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 100
      responses:
        '200':
          description: Recent anomalies
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Anomaly'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /anomalies/ci/{ciId}:
    get:
      tags: [Anomalies]
      summary: Get anomalies for CI
      description: Get all anomalies detected for a specific CI
      operationId: getAnomaliesForCI
      parameters:
        - name: ciId
          in: path
          required: true
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 50
      responses:
        '200':
          description: CI anomalies
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Anomaly'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /anomalies/stats:
    get:
      tags: [Anomalies]
      summary: Anomaly statistics
      description: Get anomaly detection statistics
      operationId: getAnomalyStats
      responses:
        '200':
          description: Anomaly stats
          content:
            application/json:
              schema:
                type: object
                properties:
                  total_anomalies:
                    type: integer
                  by_type:
                    type: object
                  by_status:
                    type: object
        '401':
          $ref: '#/components/responses/Unauthorized'

  /anomalies/{id}/status:
    patch:
      tags: [Anomalies]
      summary: Update anomaly status
      description: Update the investigation status of an anomaly
      operationId: updateAnomalyStatus
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [investigating, resolved, false_positive, confirmed, ignored]
                resolved_by:
                  type: string
      responses:
        '200':
          description: Status updated
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /anomalies/detect:
    post:
      tags: [Anomalies]
      summary: Run anomaly detection
      description: Manually trigger anomaly detection job
      operationId: runAnomalyDetection
      responses:
        '202':
          description: Detection job started
          content:
            application/json:
              schema:
                type: object
                properties:
                  job_id:
                    type: string
                  message:
                    type: string
        '401':
          $ref: '#/components/responses/Unauthorized'

  # =============================================================================
  # JOBS
  # =============================================================================
  /jobs/stats:
    get:
      tags: [Jobs]
      summary: Get job statistics
      description: Overall job statistics across all queues
      operationId: getJobStats
      responses:
        '200':
          description: Job statistics
          content:
            application/json:
              schema:
                type: object
                properties:
                  total_jobs:
                    type: integer
                  active_jobs:
                    type: integer
                  completed_jobs:
                    type: integer
                  failed_jobs:
                    type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'

  /jobs/discovery:
    get:
      tags: [Jobs]
      summary: List discovery jobs
      description: Get all discovery jobs
      operationId: listDiscoveryJobs
      responses:
        '200':
          description: Discovery jobs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Job'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /jobs/discovery/{provider}:
    post:
      tags: [Jobs]
      summary: Trigger discovery
      description: Manually trigger discovery for a provider
      operationId: triggerDiscovery
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/DiscoveryProvider'
      responses:
        '202':
          description: Discovery job queued
          content:
            application/json:
              schema:
                type: object
                properties:
                  job_id:
                    type: string
                  queue:
                    type: string
        '401':
          $ref: '#/components/responses/Unauthorized'

  /jobs/{queueName}/{jobId}:
    get:
      tags: [Jobs]
      summary: Get job status
      description: Get detailed status of a specific job
      operationId: getJobStatus
      parameters:
        - name: queueName
          in: path
          required: true
          schema:
            type: string
        - name: jobId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Job details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      tags: [Jobs]
      summary: Cancel job
      description: Cancel a running or queued job
      operationId: cancelJob
      parameters:
        - name: queueName
          in: path
          required: true
          schema:
            type: string
        - name: jobId
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Job cancelled
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /jobs/{queueName}/{jobId}/retry:
    post:
      tags: [Jobs]
      summary: Retry failed job
      description: Retry a failed job
      operationId: retryJob
      parameters:
        - name: queueName
          in: path
          required: true
          schema:
            type: string
        - name: jobId
          in: path
          required: true
          schema:
            type: string
      responses:
        '202':
          description: Job requeued
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  # =============================================================================
  # BUSINESS SERVICES
  # =============================================================================
  # Business services are scoped to the caller's organization, which comes
  # from the token (401 without credentials, 403 without an organization
  # claim). A service outside the caller's organization answers 404 exactly
  # like a missing one; create answers 409 for a service_id already in use.
  /business-services:
    get:
      tags: [Business Services]
      summary: List business services
      description: >-
        Lists the caller's organization's business services, newest first.
        Query parameters are validated only when at least one is present.
        Unknown parameters are ignored; values that fail the parameter schema
        (e.g. empty, non-integer or out-of-range, repeated) are rejected with
        400.
      operationId: listBusinessServices
      parameters:
        - name: search
          in: query
          description: >-
            Case-insensitive ILIKE match of `%<search>%` against name or
            description; `%` and `_` in the value act as wildcards.
          schema:
            type: string
            minLength: 1
        - name: service_classification
          in: query
          description: Exact match
          schema:
            type: string
            minLength: 1
        - name: tbm_tower
          in: query
          description: Exact match
          schema:
            type: string
            minLength: 1
        - name: business_criticality
          in: query
          description: Exact match
          schema:
            type: string
            minLength: 1
        - name: operational_status
          in: query
          description: Exact match
          schema:
            type: string
            minLength: 1
        - name: owned_by
          in: query
          description: Exact match
          schema:
            type: string
            minLength: 1
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        '200':
          description: One page of business services
          content:
            application/json:
              schema:
                type: object
                required: [success, data, pagination]
                properties:
                  success:
                    type: boolean
                    enum: [true]
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/BusinessService'
                  pagination:
                    type: object
                    required: [page, limit, total, totalPages]
                    properties:
                      page:
                        type: integer
                      limit:
                        type: integer
                      total:
                        type: integer
                      totalPages:
                        type: integer
        '400':
          $ref: '#/components/responses/BusinessServiceValidationError'
        '401':
          $ref: '#/components/responses/BusinessServiceUnauthorized'
        '403':
          $ref: '#/components/responses/BusinessServiceForbidden'
        '500':
          $ref: '#/components/responses/BusinessServiceServerError'

    post:
      tags: [Business Services]
      summary: Create a business service
      description: >-
        Creates a business service in the caller's organization. Requires the
        `write` permission.
      operationId: createBusinessService
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BusinessServiceInput'
      responses:
        '201':
          description: Business service created
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    type: boolean
                    enum: [true]
                  data:
                    $ref: '#/components/schemas/BusinessService'
        '400':
          $ref: '#/components/responses/BusinessServiceValidationError'
        '401':
          $ref: '#/components/responses/BusinessServiceUnauthorized'
        '403':
          $ref: '#/components/responses/BusinessServiceForbidden'
        '409':
          description: >-
            `service_id` is already taken. Service ids are unique across all
            organizations, so the id may belong to another organization.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusinessServiceError'
              example:
                success: false
                error: Business service with this ID already exists
        '500':
          $ref: '#/components/responses/BusinessServiceServerError'

  /business-services/{service_id}:
    parameters:
      - $ref: '#/components/parameters/BusinessServiceId'
    get:
      tags: [Business Services]
      summary: Get a business service
      description: The service plus its mapped-CI and dependency counts.
      operationId: getBusinessService
      responses:
        '200':
          description: Business service found
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    type: boolean
                    enum: [true]
                  data:
                    $ref: '#/components/schemas/BusinessServiceDetail'
        '401':
          $ref: '#/components/responses/BusinessServiceUnauthorized'
        '403':
          $ref: '#/components/responses/BusinessServiceForbidden'
        '404':
          $ref: '#/components/responses/BusinessServiceNotFound'
        '500':
          $ref: '#/components/responses/BusinessServiceServerError'

    patch:
      tags: [Business Services]
      summary: Update a business service
      description: >-
        Updates the given fields and sets `updated_at`. Requires the `write`
        permission.
      operationId: updateBusinessService
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BusinessServiceUpdate'
      responses:
        '200':
          description: Business service updated
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    type: boolean
                    enum: [true]
                  data:
                    $ref: '#/components/schemas/BusinessService'
        '400':
          description: >-
            Body failed validation (middleware body), or the body has no
            known fields (`{success: false, error: 'No fields to update'}`).
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/MiddlewareError'
                  - $ref: '#/components/schemas/BusinessServiceError'
        '401':
          $ref: '#/components/responses/BusinessServiceUnauthorized'
        '403':
          $ref: '#/components/responses/BusinessServiceForbidden'
        '404':
          $ref: '#/components/responses/BusinessServiceNotFound'
        '500':
          $ref: '#/components/responses/BusinessServiceServerError'

    delete:
      tags: [Business Services]
      summary: Delete a business service
      description: >-
        Deletes the service together with its CI mappings, the dependencies
        from and to it, and its health metrics. Requires the `write`
        permission.
      operationId: deleteBusinessService
      responses:
        '200':
          description: Business service deleted
          content:
            application/json:
              schema:
                type: object
                required: [success, message, data]
                properties:
                  success:
                    type: boolean
                    enum: [true]
                  message:
                    type: string
                    example: Business service deleted successfully
                  data:
                    type: object
                    required: [service_id, name]
                    properties:
                      service_id:
                        type: string
                      name:
                        type: string
        '401':
          $ref: '#/components/responses/BusinessServiceUnauthorized'
        '403':
          $ref: '#/components/responses/BusinessServiceForbidden'
        '404':
          $ref: '#/components/responses/BusinessServiceNotFound'
        '500':
          $ref: '#/components/responses/BusinessServiceServerError'

  /business-services/{service_id}/cis:
    parameters:
      - $ref: '#/components/parameters/BusinessServiceId'
    get:
      tags: [Business Services]
      summary: List CIs mapped to a business service
      description: >-
        Mappings newest first (`created_at` descending). A CI mapped under
        several mapping types appears once per type. `data` is `[]` when the
        service exists and has no mappings.
      operationId: getBusinessServiceCIs
      responses:
        '200':
          description: Mapped CIs (possibly empty)
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    type: boolean
                    enum: [true]
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/BusinessServiceCIMapping'
        '401':
          $ref: '#/components/responses/BusinessServiceUnauthorized'
        '403':
          $ref: '#/components/responses/BusinessServiceForbidden'
        '404':
          $ref: '#/components/responses/BusinessServiceNotFound'
        '500':
          $ref: '#/components/responses/BusinessServiceServerError'

    post:
      tags: [Business Services]
      summary: Map CIs to a business service
      description: >-
        Creates or updates one mapping per distinct `ci_ids` entry (duplicate
        ids are not allowed) with the given `mapping_type`; an existing
        (ci_id, mapping_type) mapping has its `confidence_score` and
        `updated_at` replaced. Every CI must be a current `cmdb.dim_ci` CI of
        the service's organization (migration 011); otherwise nothing is
        written. Unknown body fields are ignored. Requires the `write`
        permission.
      operationId: mapBusinessServiceCIs
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ci_ids]
              properties:
                ci_ids:
                  type: array
                  minItems: 1
                  uniqueItems: true
                  items:
                    type: string
                    minLength: 1
                    maxLength: 100
                    pattern: '^[^\u0000]+$'
                    description: >-
                      At most 100 Unicode characters (code points, not UTF-16
                      units). Must not contain NUL (U+0000) or unpaired
                      surrogate escapes (e.g. `\ud800` without its pair).
                mapping_type:
                  type: string
                  enum: [hosts, supports, enables, provides]
                  default: supports
                confidence_score:
                  type: number
                  minimum: 0
                  maximum: 1
                  default: 1
      responses:
        '201':
          description: Mappings created or updated
          content:
            application/json:
              schema:
                type: object
                required: [success, message, data]
                properties:
                  success:
                    type: boolean
                    enum: [true]
                  message:
                    type: string
                    description: '`<ci_ids.length> CIs mapped successfully`'
                    example: 2 CIs mapped successfully
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/BusinessServiceCIMappingRecord'
        '400':
          $ref: '#/components/responses/BusinessServiceValidationError'
        '401':
          $ref: '#/components/responses/BusinessServiceUnauthorized'
        '403':
          $ref: '#/components/responses/BusinessServiceForbidden'
        '404':
          description: >-
            The service is unknown or belongs to another organization
            (`Business service not found`), or a requested CI has no current
            `cmdb.dim_ci` row or belongs to another organization (`CI not
            found`; the same body for both). Nothing is written.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusinessServiceError'
              examples:
                service:
                  value:
                    success: false
                    error: Business service not found
                ci:
                  value:
                    success: false
                    error: CI not found
        '500':
          $ref: '#/components/responses/BusinessServiceServerError'

  /business-services/{service_id}/cis/{ci_id}:
    parameters:
      - $ref: '#/components/parameters/BusinessServiceId'
      - name: ci_id
        in: path
        required: true
        description: Mapped CI identifier
        schema:
          type: string
    delete:
      tags: [Business Services]
      summary: Unmap a CI from a business service
      description: >-
        Removes every mapping of the CI to the service (all mapping types).
        Requires the `write` permission.
      operationId: unmapBusinessServiceCI
      responses:
        '200':
          description: CI unmapped
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusinessServiceMessage'
              example:
                success: true
                message: CI unmapped successfully
        '401':
          $ref: '#/components/responses/BusinessServiceUnauthorized'
        '403':
          $ref: '#/components/responses/BusinessServiceForbidden'
        '404':
          description: >-
            The service is unknown or belongs to another organization, or the
            CI is not mapped to it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusinessServiceError'
              example:
                success: false
                error: CI mapping not found
        '500':
          $ref: '#/components/responses/BusinessServiceServerError'

  /business-services/{service_id}/dependencies:
    parameters:
      - $ref: '#/components/parameters/BusinessServiceId'
    get:
      tags: [Business Services]
      summary: List the services a business service depends on
      description: >-
        Dependencies newest first (`created_at` descending), with the target
        service's details. Only targets in the caller's organization are
        returned. `data` is `[]` when the service exists and has no
        dependencies.
      operationId: getBusinessServiceDependencies
      responses:
        '200':
          description: Dependencies (possibly empty)
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    type: boolean
                    enum: [true]
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/BusinessServiceDependency'
        '401':
          $ref: '#/components/responses/BusinessServiceUnauthorized'
        '403':
          $ref: '#/components/responses/BusinessServiceForbidden'
        '404':
          $ref: '#/components/responses/BusinessServiceNotFound'
        '500':
          $ref: '#/components/responses/BusinessServiceServerError'

    post:
      tags: [Business Services]
      summary: Create a service dependency
      description: >-
        Records that `service_id` depends on `depends_on_service_id`. Both
        services must belong to the caller's organization. Requires the
        `write` permission.
      operationId: createBusinessServiceDependency
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [depends_on_service_id]
              properties:
                depends_on_service_id:
                  type: string
                  minLength: 1
                dependency_type:
                  type: string
                  enum: [technical, business, data, security]
                  default: technical
      responses:
        '201':
          description: Dependency created
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    type: boolean
                    enum: [true]
                  data:
                    $ref: '#/components/schemas/BusinessServiceDependencyRecord'
        '400':
          description: >-
            Body failed validation (middleware body), or the service would
            depend on itself (`{success: false, error: 'Cannot create circular
            dependency (service cannot depend on itself)'}`).
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/MiddlewareError'
                  - $ref: '#/components/schemas/BusinessServiceError'
        '401':
          $ref: '#/components/responses/BusinessServiceUnauthorized'
        '403':
          $ref: '#/components/responses/BusinessServiceForbidden'
        '404':
          description: >-
            Either service is unknown or belongs to another organization.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusinessServiceError'
              example:
                success: false
                error: Business service not found
        '409':
          description: The dependency already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusinessServiceError'
              example:
                success: false
                error: This dependency already exists
        '500':
          $ref: '#/components/responses/BusinessServiceServerError'

  /business-services/{service_id}/dependencies/{depends_on_service_id}:
    parameters:
      - $ref: '#/components/parameters/BusinessServiceId'
      - name: depends_on_service_id
        in: path
        required: true
        description: Target service of the dependency
        schema:
          type: string
    delete:
      tags: [Business Services]
      summary: Delete a service dependency
      description: Requires the `write` permission.
      operationId: deleteBusinessServiceDependency
      responses:
        '200':
          description: Dependency deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusinessServiceMessage'
              example:
                success: true
                message: Dependency deleted successfully
        '401':
          $ref: '#/components/responses/BusinessServiceUnauthorized'
        '403':
          $ref: '#/components/responses/BusinessServiceForbidden'
        '404':
          description: >-
            The service is unknown or belongs to another organization, or it
            has no dependency on `depends_on_service_id`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusinessServiceError'
              example:
                success: false
                error: Dependency not found
        '500':
          $ref: '#/components/responses/BusinessServiceServerError'

  /business-services/{service_id}/health:
    parameters:
      - $ref: '#/components/parameters/BusinessServiceId'
    get:
      tags: [Business Services]
      summary: Get business service health metrics
      description: >-
        Incident and change metrics over the windows
        [utc_today - 7 days, utc_today] and [utc_today - 30 days, utc_today]
        (inclusive, utc_today = the current UTC date; future-dated events are
        excluded). Counts are sums of daily per-service counters. A service
        with no data in a window returns 0 counts and null averages/ratios.
      operationId: getBusinessServiceHealth
      responses:
        '200':
          description: Health metrics
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    type: boolean
                    enum: [true]
                  data:
                    $ref: '#/components/schemas/BusinessServiceHealth'
        '401':
          $ref: '#/components/responses/BusinessServiceUnauthorized'
        '403':
          $ref: '#/components/responses/BusinessServiceForbidden'
        '404':
          $ref: '#/components/responses/BusinessServiceNotFound'
        '500':
          $ref: '#/components/responses/BusinessServiceServerError'

  /business-services/{service_id}/costs:
    parameters:
      - $ref: '#/components/parameters/BusinessServiceId'
    get:
      tags: [Business Services]
      summary: Get business service cost summary
      description: >-
        Monthly cost of the CIs mapped to the service, in total and per TBM
        resource tower. A CI mapped under several mapping types is counted
        and costed once. Only mapped CIs with a current `cmdb.dim_ci` row in
        the caller's organization count; a mapping that names another
        organization's CI adds nothing. A service with no such CIs returns
        `ci_count` 0 and null totals.
      operationId: getBusinessServiceCosts
      responses:
        '200':
          description: Cost summary
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    type: boolean
                    enum: [true]
                  data:
                    $ref: '#/components/schemas/BusinessServiceCosts'
        '401':
          $ref: '#/components/responses/BusinessServiceUnauthorized'
        '403':
          $ref: '#/components/responses/BusinessServiceForbidden'
        '404':
          $ref: '#/components/responses/BusinessServiceNotFound'
        '500':
          $ref: '#/components/responses/BusinessServiceServerError'

  # =============================================================================
  # HEALTH
  # =============================================================================
  /cmdb-health:
    get:
      tags: [Health]
      summary: Health check
      description: Get overall system health status
      operationId: healthCheck
      security: []
      responses:
        '200':
          description: System healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [healthy, degraded, unhealthy]
                  timestamp:
                    type: string
                    format: date-time
                  services:
                    type: object
                    properties:
                      neo4j:
                        type: string
                        enum: [up, down]
                      postgres:
                        type: string
                        enum: [up, down]
                      redis:
                        type: string
                        enum: [up, down]
        '503':
          description: System unhealthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [unhealthy]
                  errors:
                    type: array
                    items:
                      type: string

# =============================================================================
# REUSABLE COMPONENTS
# =============================================================================
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token from /auth/login endpoint
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: API key from /auth/api-keys endpoint

  parameters:
    CIId:
      name: id
      in: path
      required: true
      description: CI unique identifier
      schema:
        type: string
      example: srv-prod-web-01

    KeyId:
      name: keyId
      in: path
      required: true
      description: API key ID
      schema:
        type: string
        format: uuid

    Limit:
      name: _limit
      in: query
      description: Maximum number of results
      schema:
        type: integer
        minimum: 1
        maximum: 1000
        default: 100

    Offset:
      name: _offset
      in: query
      description: Number of results to skip
      schema:
        type: integer
        minimum: 0
        default: 0

    BusinessServiceId:
      name: service_id
      in: path
      required: true
      description: Business service identifier
      schema:
        type: string
      example: bs-web

  responses:
    BadRequest:
      description: Invalid request parameters
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: Validation Error
            message: Invalid CI type provided
            details:
              - field: _type
                error: must be one of [server, virtual-machine, ...]

    Unauthorized:
      description: Authentication required or invalid token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: Unauthorized
            message: Invalid or expired JWT token

    Forbidden:
      description: Insufficient permissions
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: Not Found
            message: CI not found

    CIForbidden:
      description: >-
        The authenticated user has no organization: every /cis endpoint is
        tenant-scoped and rejects the request before any data access. Mutations
        also return 403 without the `write` permission.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MiddlewareError'
          example:
            _error: Forbidden
            _message: Organization claim required

    CIBodyBadRequest:
      description: >-
        Invalid CI body. `organization_id` is never accepted in a body (the
        organization always comes from the token) and is rejected with 400.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MiddlewareError'
          example:
            _success: false
            _error: Validation Error
            _message: '"organization_id" is not allowed'
            _details:
              - _field: organization_id
                _message: '"organization_id" is not allowed'
                _type: any.unknown

    BusinessServiceValidationError:
      description: >-
        Request failed validation (body, or query for the list). `_message`
        and `_details` carry the validation messages, e.g. for an empty
        string or an out-of-range value. Unknown fields are ignored, not
        rejected; only `organization_id` on the create/update bodies is
        rejected, since the organization always comes from the token. A body
        that is not valid JSON gets `_error: Bad Request` with `_message:
        Malformed request body` and no `_details`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MiddlewareError'
          examples:
            query:
              summary: Invalid list query parameter
              value:
                _success: false
                _error: Validation Error
                _message: '"limit" must be less than or equal to 100'
                _details:
                  - _field: limit
                    _message: '"limit" must be less than or equal to 100'
                    _type: number.max
            body:
              summary: Invalid body field
              value:
                _success: false
                _error: Validation Error
                _message: '"name" length must be at least 3 characters long'
                _details:
                  - _field: name
                    _message: '"name" length must be at least 3 characters long'
                    _type: string.min

    BusinessServiceUnauthorized:
      description: No credentials, or the JWT / API key failed verification
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MiddlewareError'
          example:
            _error: Unauthorized
            _message: No authentication credentials provided

    BusinessServiceForbidden:
      description: >-
        The authenticated user has no organization: every /business-services
        endpoint is tenant-scoped and rejects the request before any data
        access (`Organization claim required`). Mutations (POST, PATCH,
        DELETE) also return 403 without the `write` permission
        (`Permission 'write' required`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MiddlewareError'
          example:
            _error: Forbidden
            _message: Organization claim required

    BusinessServiceNotFound:
      description: >-
        No business service with this id in the caller's organization. A
        service owned by another organization returns the identical body.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/BusinessServiceError'
          example:
            success: false
            error: Business service not found

    BusinessServiceServerError:
      description: >-
        Unexpected server failure. The body is either `{success: false,
        error}` with a fixed per-operation message or the generic middleware
        error body (`_error: Internal Server Error`, `_message: An unexpected
        error occurred`). Neither carries the underlying error text.
      content:
        application/json:
          schema:
            oneOf:
              - $ref: '#/components/schemas/BusinessServiceError'
              - $ref: '#/components/schemas/MiddlewareError'
          example:
            success: false
            error: Failed to get service costs

    TooManyRequests:
      description: Rate limit exceeded
      headers:
        X-RateLimit-Limit:
          schema:
            type: integer
          description: Maximum requests per window
        X-RateLimit-Remaining:
          schema:
            type: integer
          description: Remaining requests
        X-RateLimit-Reset:
          schema:
            type: integer
          description: Unix timestamp when limit resets
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  schemas:
    # =========================================================================
    # CORE MODELS
    # =========================================================================
    CI:
      type: object
      required: [_id, name, _type, _status, _created_at, _updated_at, _discovered_at]
      properties:
        _id:
          type: string
          description: Unique identifier
          example: srv-prod-web-01
        external_id:
          type: string
          description: External system ID (e.g., AWS instance ID)
          example: i-0123456789abcdef0
        name:
          type: string
          description: Human-readable name
          example: Production Web Server 01
        _type:
          $ref: '#/components/schemas/CIType'
        _status:
          $ref: '#/components/schemas/CIStatus'
        environment:
          $ref: '#/components/schemas/Environment'
        _created_at:
          type: string
          format: date-time
          description: When CI was created in CMDB
        _updated_at:
          type: string
          format: date-time
          description: Last update timestamp
        _discovered_at:
          type: string
          format: date-time
          description: When CI was discovered
        _metadata:
          type: object
          additionalProperties: true
          description: Additional attributes and metadata
          example:
            hostname: web01.example.com
            ip_address: 192.168.1.10
            os: Ubuntu 22.04
            cpu_cores: 8
            memory_gb: 32

    CIInput:
      type: object
      required: [_id, name, _type]
      properties:
        _id:
          type: string
          maxLength: 100
        external_id:
          type: string
          maxLength: 200
        name:
          type: string
        _type:
          $ref: '#/components/schemas/CIType'
        status:
          $ref: '#/components/schemas/CIStatus'
        environment:
          $ref: '#/components/schemas/Environment'
        discovered_at:
          type: string
          format: date-time
        metadata:
          type: object
          additionalProperties: true

    CIType:
      type: string
      enum:
        - server
        - virtual-machine
        - container
        - application
        - service
        - database
        - network-device
        - storage
        - load-balancer
        - cloud-resource
        - alert
        - vulnerability
        - software
        - detection
        - incident
        - hardware-component
        - mobile-device
        - policy
        - configuration
        - user
        - group
        - organizational-unit
        - collection
        - update

    CIStatus:
      type: string
      enum: [active, inactive, maintenance, decommissioned]

    Environment:
      type: string
      enum: [production, staging, development, test]

    Relationship:
      type: object
      required: [_from_id, _to_id, _type]
      properties:
        _from_id:
          type: string
          description: Source CI ID
        _to_id:
          type: string
          description: Target CI ID
        _type:
          $ref: '#/components/schemas/RelationshipType'
        properties:
          type: object
          additionalProperties: true
          description: Additional relationship metadata

    RelationshipInput:
      type: object
      required: [_from_id, _to_id, _type]
      properties:
        _from_id:
          type: string
        _to_id:
          type: string
        _type:
          $ref: '#/components/schemas/RelationshipType'
        properties:
          type: object
          additionalProperties: true

    RelationshipType:
      type: string
      enum:
        - DEPENDS_ON
        - HOSTS
        - CONNECTS_TO
        - USES
        - OWNED_BY
        - PART_OF
        - LOCATED_IN
        - DEPLOYED_ON
        - BACKED_UP_BY
        - DETECTED_ON
        - AFFECTS
        - INSTALLED_ON
        - CONTAINS
        - ASSIGNED_TO
        - APPLIES_TO
        - MEMBER_OF
        - REQUIRED_BY
        - HOSTED_ON

    # =========================================================================
    # AUTHENTICATION
    # =========================================================================
    User:
      type: object
      properties:
        _id:
          type: string
          format: uuid
        _username:
          type: string
        _email:
          type: string
          format: email
        _role:
          type: string
          enum: [admin, user, readonly]
        _enabled:
          type: boolean
        _createdAt:
          type: string
          format: date-time

    ApiKey:
      type: object
      properties:
        _id:
          type: string
          format: uuid
        _name:
          type: string
        _role:
          type: string
        _enabled:
          type: boolean
        _createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        lastUsedAt:
          type: string
          format: date-time

    # =========================================================================
    # CREDENTIALS
    # =========================================================================
    Credential:
      type: object
      required: [id, name, protocol, scope, created_at]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        protocol:
          $ref: '#/components/schemas/AuthProtocol'
        scope:
          $ref: '#/components/schemas/CredentialScope'
        credentials:
          type: object
          description: Encrypted credentials (redacted in responses)
        affinity:
          $ref: '#/components/schemas/CredentialAffinity'
        tags:
          type: array
          items:
            type: string
        created_at:
          type: string
          format: date-time
        created_by:
          type: string
        last_used_at:
          type: string
          format: date-time

    CredentialSummary:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        protocol:
          $ref: '#/components/schemas/AuthProtocol'
        scope:
          $ref: '#/components/schemas/CredentialScope'
        tags:
          type: array
          items:
            type: string
        created_at:
          type: string
          format: date-time

    CreateCredentialInput:
      type: object
      required: [_name, _protocol, _scope, _credentials]
      properties:
        _name:
          type: string
          minLength: 1
          maxLength: 255
        _description:
          type: string
          maxLength: 1000
        _protocol:
          $ref: '#/components/schemas/AuthProtocol'
        _scope:
          $ref: '#/components/schemas/CredentialScope'
        _credentials:
          type: object
          additionalProperties: true
          description: Protocol-specific credentials
        _affinity:
          $ref: '#/components/schemas/CredentialAffinity'
        _tags:
          type: array
          items:
            type: string

    AuthProtocol:
      type: string
      enum:
        - oauth2
        - api_key
        - basic
        - bearer
        - aws_iam
        - azure_sp
        - gcp_sa
        - ssh_key
        - ssh_password
        - certificate
        - kerberos
        - snmp_v2c
        - snmp_v3
        - winrm

    CredentialScope:
      type: string
      enum: [cloud_provider, ssh, api, network, database, container, universal]

    CredentialAffinity:
      type: object
      properties:
        _networks:
          type: array
          items:
            type: string
          description: CIDR network ranges
          example: ["10.0.0.0/8"]
        _hostname_patterns:
          type: array
          items:
            type: string
          description: Regex patterns for hostname matching
          example: [".*\\.prod\\.example\\.com"]
        _os_types:
          type: array
          items:
            type: string
          example: [ubuntu, debian, centos]
        _device_types:
          type: array
          items:
            type: string
          example: [server, virtual-machine]
        _environments:
          type: array
          items:
            type: string
          example: [production, staging]
        _cloud_providers:
          type: array
          items:
            type: string
          example: [aws, azure, gcp]
        _priority:
          type: integer
          minimum: 1
          maximum: 10
          description: Priority when multiple credentials match (higher = preferred)

    CredentialMatchContext:
      type: object
      properties:
        _ip:
          type: string
        _hostname:
          type: string
        _os_type:
          type: string
        _device_type:
          type: string
        _environment:
          type: string
        _cloud_provider:
          type: string
        _required_protocol:
          $ref: '#/components/schemas/AuthProtocol'
        _required_scope:
          $ref: '#/components/schemas/CredentialScope'

    CredentialSet:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        credential_ids:
          type: array
          items:
            type: string
            format: uuid
        strategy:
          type: string
          enum: [sequential, parallel, adaptive]
        stop_on_success:
          type: boolean
        tags:
          type: array
          items:
            type: string
        created_at:
          type: string
          format: date-time

    # =========================================================================
    # DISCOVERY
    # =========================================================================
    DiscoveryDefinition:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        provider:
          $ref: '#/components/schemas/DiscoveryProvider'
        method:
          $ref: '#/components/schemas/DiscoveryMethod'
        credential_id:
          type: string
          format: uuid
        agent_id:
          type: string
        config:
          type: object
          additionalProperties: true
        schedule:
          type: string
          description: Cron expression
          example: "0 */6 * * *"
        is_active:
          type: boolean
        tags:
          type: array
          items:
            type: string
        created_at:
          type: string
          format: date-time
        created_by:
          type: string

    CreateDiscoveryDefinitionInput:
      type: object
      required: [name, provider, method]
      properties:
        name:
          type: string
        description:
          type: string
        provider:
          $ref: '#/components/schemas/DiscoveryProvider'
        method:
          $ref: '#/components/schemas/DiscoveryMethod'
        credential_id:
          type: string
          format: uuid
        agent_id:
          type: string
        config:
          type: object
        schedule:
          type: string
        is_active:
          type: boolean
        tags:
          type: array
          items:
            type: string

    DiscoveryProvider:
      type: string
      enum:
        - aws
        - azure
        - gcp
        - vmware
        - kubernetes
        - docker
        - nmap
        - ssh
        - snmp
        - active_directory
        - servicenow
        - salesforce
        - datadog
        - pagerduty

    DiscoveryMethod:
      type: string
      enum: [connector, agent]
      description: connector = API-based, agent = network-based

    DiscoveryAgent:
      type: object
      properties:
        agent_id:
          type: string
        hostname:
          type: string
        provider_capabilities:
          type: array
          items:
            $ref: '#/components/schemas/DiscoveryProvider'
        reachable_networks:
          type: array
          items:
            type: string
          description: CIDR network ranges
        version:
          type: string
        platform:
          type: string
        arch:
          type: string
        api_endpoint:
          type: string
        status:
          type: string
          enum: [active, inactive, offline, disabled]
        last_heartbeat:
          type: string
          format: date-time
        stats:
          type: object
          properties:
            jobs_completed:
              type: integer
            jobs_failed:
              type: integer
            cis_discovered:
              type: integer
        tags:
          type: array
          items:
            type: string
        registered_at:
          type: string
          format: date-time

    RegisterAgentInput:
      type: object
      required: [agent_id, hostname, provider_capabilities, reachable_networks]
      properties:
        agent_id:
          type: string
        hostname:
          type: string
        provider_capabilities:
          type: array
          items:
            $ref: '#/components/schemas/DiscoveryProvider'
        reachable_networks:
          type: array
          items:
            type: string
        version:
          type: string
        platform:
          type: string
        arch:
          type: string
        api_endpoint:
          type: string
        tags:
          type: array
          items:
            type: string

    # =========================================================================
    # CONNECTORS
    # =========================================================================
    ConnectorRegistryEntry:
      type: object
      properties:
        connector_type:
          type: string
        name:
          type: string
        version:
          type: string
        description:
          type: string
        category:
          type: string
          enum: [discovery, connector]
        tags:
          type: array
          items:
            type: string
        verified:
          type: boolean
        downloads:
          type: integer
        rating:
          type: number

    InstalledConnector:
      type: object
      properties:
        connector_type:
          type: string
        name:
          type: string
        version:
          type: string
        category:
          type: string
        enabled:
          type: boolean
        installed_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    # =========================================================================
    # RECONCILIATION
    # =========================================================================
    MatchRequest:
      type: object
      required: [identifiers]
      properties:
        identifiers:
          type: object
          properties:
            external_id:
              type: string
            serial_number:
              type: string
            uuid:
              type: string
            mac_address:
              type: array
              items:
                type: string
            fqdn:
              type: string
            hostname:
              type: string
            ip_address:
              type: array
              items:
                type: string
        source:
          type: string
        ci_type:
          type: string
        environment:
          type: string

    MergeRequest:
      type: object
      required: [name, ci_type, source, source_id, identifiers]
      properties:
        name:
          type: string
        ci_type:
          type: string
        source:
          type: string
        source_id:
          type: string
        identifiers:
          type: object
        attributes:
          type: object
        relationships:
          type: array
        confidence_score:
          type: number
        environment:
          type: string
        status:
          type: string

    ReconciliationConflict:
      type: object
      properties:
        id:
          type: string
          format: uuid
        source_ci:
          $ref: '#/components/schemas/CI'
        target_ci:
          $ref: '#/components/schemas/CI'
        conflicting_fields:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              source_value:
                type: string
              target_value:
                type: string
        status:
          type: string
          enum: [pending, resolved, dismissed]
        detected_at:
          type: string
          format: date-time

    ReconciliationRule:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        identification_rules:
          type: array
          items:
            type: object
        merge_strategies:
          type: array
          items:
            type: object
        enabled:
          type: boolean

    CreateReconciliationRuleInput:
      type: object
      required: [name, identification_rules]
      properties:
        name:
          type: string
        identification_rules:
          type: array
          items:
            type: object
        merge_strategies:
          type: array
          items:
            type: object
        enabled:
          type: boolean

    # =========================================================================
    # ANOMALIES
    # =========================================================================
    Anomaly:
      type: object
      properties:
        id:
          type: string
          format: uuid
        ci_id:
          type: string
        anomaly_type:
          type: string
          enum: [config_drift, unexpected_change, performance_anomaly, relationship_anomaly]
        severity:
          type: string
          enum: [low, medium, high, critical]
        description:
          type: string
        detected_at:
          type: string
          format: date-time
        status:
          type: string
          enum: [investigating, resolved, false_positive, confirmed, ignored]
        resolved_by:
          type: string
        resolved_at:
          type: string
          format: date-time

    # =========================================================================
    # JOBS
    # =========================================================================
    Job:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        queue:
          type: string
        status:
          type: string
          enum: [waiting, active, completed, failed, delayed]
        progress:
          type: number
        data:
          type: object
        result:
          type: object
        error:
          type: object
        created_at:
          type: string
          format: date-time
        started_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time

    # =========================================================================
    # AUDIT
    # =========================================================================
    AuditEntry:
      type: object
      properties:
        id:
          type: string
          format: uuid
        ci_id:
          type: string
        action:
          type: string
          enum: [created, updated, deleted]
        changes:
          type: object
        performed_by:
          type: string
        timestamp:
          type: string
          format: date-time

    # =========================================================================
    # ERROR
    # =========================================================================
    Error:
      type: object
      required: [error, message]
      properties:
        error:
          type: string
          description: Error type/code
          example: Validation Error
        message:
          type: string
          description: Human-readable error message
          example: Invalid CI type provided
        details:
          type: array
          description: Detailed validation errors
          items:
            type: object
            properties:
              field:
                type: string
              error:
                type: string

    MiddlewareError:
      type: object
      description: >-
        Error body produced by the auth and request-validation middleware and
        the global error handler (underscore-prefixed keys), e.g. the /cis
        403, the body-validation 400 and the malformed-body 400.
      required: [_error, _message]
      properties:
        _success:
          type: boolean
          example: false
        _error:
          type: string
          example: Validation Error
        _message:
          type: string
          example: '"organization_id" is not allowed'
        _details:
          type: array
          items:
            type: object
            properties:
              _field:
                type: string
              _message:
                type: string
              _type:
                type: string

    # =========================================================================
    # BUSINESS SERVICES
    # =========================================================================
    BusinessServiceError:
      type: object
      description: Error body produced by the business-service handlers
      required: [success, error]
      properties:
        success:
          type: boolean
          enum: [false]
        error:
          type: string
          example: Business service not found

    BusinessServiceMessage:
      type: object
      required: [success, message]
      properties:
        success:
          type: boolean
          enum: [true]
        message:
          type: string

    BusinessServiceClassification:
      type: string
      enum: [compute, storage, network, data, application, security, end_user, iot, blockchain, quantum, other_it]

    BusinessCriticality:
      type: string
      enum: [critical, high, medium, low]

    CountValue:
      description: >-
        Integer count, emitted as a decimal string (e.g. "10"). Clients
        should also accept a JSON integer.
      oneOf:
        - type: string
          pattern: '^-?[0-9]+$'
        - type: integer
      example: '10'

    BusinessService:
      type: object
      description: A business service
      required:
        - service_id
        - name
        - service_classification
        - tbm_tower
        - business_criticality
        - operational_status
        - organization_id
      properties:
        service_id:
          type: string
          example: bs-web
        name:
          type: string
        description:
          type: string
          nullable: true
        service_classification:
          $ref: '#/components/schemas/BusinessServiceClassification'
        tbm_tower:
          type: string
          description: TBM capability tower (validated against the classification values on write)
        business_criticality:
          $ref: '#/components/schemas/BusinessCriticality'
        operational_status:
          type: string
          description: Stored operational status
          enum: [active, inactive, maintenance, decommissioned]
        service_type:
          type: string
          nullable: true
        owned_by:
          type: string
          nullable: true
        managed_by:
          type: string
          nullable: true
        support_group:
          type: string
          nullable: true
        service_level_requirement:
          type: string
          nullable: true
        category:
          type: string
          nullable: true
        tags:
          type: array
          nullable: true
          items:
            type: string
        related_ci_types:
          type: array
          nullable: true
          items:
            type: string
        cost_allocation:
          type: object
          nullable: true
          additionalProperties: true
        metadata:
          type: object
          nullable: true
          additionalProperties: true
        created_at:
          type: string
          format: date-time
          nullable: true
        updated_at:
          type: string
          format: date-time
          nullable: true
        organization_id:
          type: string
          format: uuid
          description: Owning organization (always the caller's)

    BusinessServiceDetail:
      allOf:
        - $ref: '#/components/schemas/BusinessService'
        - type: object
          required: [mapped_cis_count, dependencies_count]
          properties:
            mapped_cis_count:
              type: integer
              description: Number of CI mappings (one per CI and mapping type)
            dependencies_count:
              type: integer
              description: Number of services this service depends on

    BusinessServiceInput:
      type: object
      description: >-
        Unknown fields are ignored. `organization_id` is rejected with 400;
        the organization always comes from the token.
      required: [service_id, name, service_classification, tbm_tower, business_criticality]
      properties:
        service_id:
          type: string
          pattern: '^bs-[a-z0-9-]+$'
          maxLength: 50
          description: Unique across all organizations
        name:
          type: string
          minLength: 3
          maxLength: 255
        description:
          type: string
        service_classification:
          $ref: '#/components/schemas/BusinessServiceClassification'
        tbm_tower:
          $ref: '#/components/schemas/BusinessServiceClassification'
        business_criticality:
          $ref: '#/components/schemas/BusinessCriticality'
        operational_status:
          type: string
          enum: [active, inactive]
          default: active
        service_type:
          type: string
          minLength: 1
          maxLength: 50
        owned_by:
          type: string
          minLength: 1
          maxLength: 255
        managed_by:
          type: string
          minLength: 1
          maxLength: 255
        support_group:
          type: string
          minLength: 1
          maxLength: 255
        service_level_requirement:
          type: string
          minLength: 1
        category:
          type: string
          minLength: 1
          maxLength: 100
        tags:
          type: array
          items:
            type: string
            minLength: 1
        related_ci_types:
          type: array
          items:
            type: string
            minLength: 1
        cost_allocation:
          type: object
          additionalProperties: true
        metadata:
          type: object
          additionalProperties: true

    BusinessServiceUpdate:
      type: object
      description: >-
        At least one known field is required: unknown fields are ignored, so
        a body with none of these fields returns 400 `No fields to update`.
        `organization_id` is rejected with 400.
      properties:
        name:
          type: string
          minLength: 3
          maxLength: 255
        description:
          type: string
        service_classification:
          $ref: '#/components/schemas/BusinessServiceClassification'
        tbm_tower:
          $ref: '#/components/schemas/BusinessServiceClassification'
        business_criticality:
          $ref: '#/components/schemas/BusinessCriticality'
        operational_status:
          type: string
          enum: [active, inactive]
        service_type:
          type: string
          minLength: 1
          maxLength: 50
        owned_by:
          type: string
          minLength: 1
          maxLength: 255
        managed_by:
          type: string
          minLength: 1
          maxLength: 255
        support_group:
          type: string
          minLength: 1
          maxLength: 255
        service_level_requirement:
          type: string
          minLength: 1
        category:
          type: string
          minLength: 1
          maxLength: 100
        tags:
          type: array
          items:
            type: string
            minLength: 1
        related_ci_types:
          type: array
          items:
            type: string
            minLength: 1
        cost_allocation:
          type: object
          additionalProperties: true
        metadata:
          type: object
          additionalProperties: true

    BusinessServiceCIMapping:
      type: object
      required: [ci_id, mapping_type, confidence_score, created_at]
      properties:
        ci_id:
          type: string
        mapping_type:
          type: string
          example: supports
        confidence_score:
          type: number
          nullable: true
          minimum: 0
          maximum: 1
        created_at:
          type: string
          format: date-time
          nullable: true

    BusinessServiceCIMappingRecord:
      description: A CI mapping as stored
      allOf:
        - $ref: '#/components/schemas/BusinessServiceCIMapping'
        - type: object
          required: [id, service_id, updated_at]
          properties:
            id:
              type: integer
            service_id:
              type: string
            updated_at:
              type: string
              format: date-time
              nullable: true

    BusinessServiceDependency:
      type: object
      required:
        - depends_on_service_id
        - depends_on_name
        - service_classification
        - business_criticality
        - dependency_type
        - created_at
      properties:
        depends_on_service_id:
          type: string
        depends_on_name:
          type: string
          description: Name of the target service
        service_classification:
          $ref: '#/components/schemas/BusinessServiceClassification'
        business_criticality:
          $ref: '#/components/schemas/BusinessCriticality'
        dependency_type:
          type: string
          example: technical
        created_at:
          type: string
          format: date-time
          nullable: true

    BusinessServiceDependencyRecord:
      type: object
      description: A service dependency as stored
      required: [id, service_id, depends_on_service_id, dependency_type, created_at]
      properties:
        id:
          type: integer
        service_id:
          type: string
        depends_on_service_id:
          type: string
        dependency_type:
          type: string
        created_at:
          type: string
          format: date-time
          nullable: true

    BusinessServiceHealth:
      type: object
      required: [incidents, changes]
      properties:
        incidents:
          type: object
          required: [incidents_7d, incidents_30d, avg_mttr_30d, sla_breaches_30d]
          properties:
            incidents_7d:
              $ref: '#/components/schemas/CountValue'
            incidents_30d:
              $ref: '#/components/schemas/CountValue'
            avg_mttr_30d:
              type: number
              nullable: true
              description: >-
                Incident-weighted mean time to resolve (minutes) over the
                30-day window; null when no in-window incident has an MTTR.
            sla_breaches_30d:
              $ref: '#/components/schemas/CountValue'
        changes:
          type: object
          required: [changes_7d, changes_30d, success_rate_30d]
          properties:
            changes_7d:
              $ref: '#/components/schemas/CountValue'
            changes_30d:
              $ref: '#/components/schemas/CountValue'
            success_rate_30d:
              type: number
              nullable: true
              description: >-
                Successful changes / changes * 100 over the 30-day window;
                null when the window has no changes.
      example:
        incidents:
          incidents_7d: '3'
          incidents_30d: '10'
          avg_mttr_30d: 72
          sla_breaches_30d: '3'
        changes:
          changes_7d: '4'
          changes_30d: '10'
          success_rate_30d: 90

    BusinessServiceCosts:
      type: object
      required: [ci_count, total_monthly_cost, cost_by_tower]
      properties:
        ci_count:
          $ref: '#/components/schemas/CountValue'
        total_monthly_cost:
          type: string
          nullable: true
          description: >-
            Sum of the mapped CIs' monthly cost as a decimal string (e.g.
            "150.5"); null when no mapped CI has a cost.
        cost_by_tower:
          type: object
          nullable: true
          additionalProperties:
            type: number
            nullable: true
          description: >-
            Monthly cost per TBM resource tower (JSON numbers; null for a
            tower none of whose CIs has a `monthly_cost`); null when no mapped
            CI has a resource tower.
      example:
        ci_count: '2'
        total_monthly_cost: '150.5'
        cost_by_tower:
          compute: 100
          storage: 50.5
