      tags: [Connectors]
      summary: Check for updates
      description: Get list of outdated connectors
      operationId: checkOutdatedConnectors
      responses:
        '200':
          description: Outdated connectors
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    connector_type:
                      type: string
                    current_version:
                      type: string
                    latest_version:
                      type: string
        '401':
          $ref: '#/components/responses/Unauthorized'

  /connectors/cache/refresh:
    post:
      tags: [Connectors]
      summary: Refresh registry cache
      description: Clear and refresh connector registry cache
      operationId: refreshRegistryCache
      responses:
        '200':
          description: Cache refreshed
        '401':
          $ref: '#/components/responses/Unauthorized'

  # =============================================================================
  # RECONCILIATION
  # =============================================================================
  /reconciliation/match:
    post:
      tags: [Reconciliation]
      summary: Find matching CIs
      description: Find duplicate/matching CIs based on identifiers
      operationId: findMatches
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MatchRequest'
      responses:
        '200':
          description: Matching CIs
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    ci:
                      $ref: '#/components/schemas/CI'
                    match_score:
                      type: number
                    matching_attributes:
                      type: array
                      items:
                        type: string
        '401':
          $ref: '#/components/responses/Unauthorized'

  /reconciliation/merge:
    post:
      tags: [Reconciliation]
      summary: Merge CI
      description: Merge an existing CI in the authenticated caller's organization. Unknown, foreign-organization, and organization-less targets all return the same 404; this endpoint does not create CIs.
      operationId: mergeCI
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MergeRequest'
      responses:
        '200':
          description: CI merged successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  ci:
                    $ref: '#/components/schemas/CI'
                  action:
                    type: string
                    enum: [updated, merged]
                  conflicts:
                    type: array
                    items:
                      type: object
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Verified organization claim required
        '404':
          description: CI not found in the caller's organization

  /reconciliation/conflicts:
    get:
      tags: [Reconciliation]
      summary: List conflicts
      description: Get pending reconciliation conflicts
      operationId: listConflicts
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, resolved, dismissed]
            default: pending
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: List of conflicts
          content:
            application/json:
              schema:
                type: object
                properties:
                  conflicts:
                    type: array
                    items:
                      $ref: '#/components/schemas/ReconciliationConflict'
                  total:
                    type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'

  /reconciliation/conflicts/{id}/resolve:
    post:
      tags: [Reconciliation]
      summary: Resolve conflict
      description: Resolve a specific reconciliation conflict
      operationId: resolveConflict
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [resolution]
              properties:
                resolution:
                  type: string
                  enum: [accept_source, accept_target, merge]
                merged_data:
                  type: object
      responses:
        '200':
          description: Conflict resolved
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /reconciliation/rules:
    get:
      tags: [Reconciliation]
      summary: List reconciliation rules
      operationId: listReconciliationRules
      responses:
        '200':
          description: Reconciliation rules
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ReconciliationRule'
        '401':
          $ref: '#/components/responses/Unauthorized'

    post:
      tags: [Reconciliation]
      summary: Create reconciliation rule
      operationId: createReconciliationRule
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateReconciliationRuleInput'
      responses:
        '201':
          description: Rule created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReconciliationRule'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /reconciliation/lineage/{ci_id}:
    get:
      tags: [Reconciliation]
      summary: Get CI lineage
      description: Get source lineage for a CI
      operationId: getCILineage
      parameters:
        - name: ci_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: CI lineage
          content:
            application/json:
              schema:
                type: object
                properties:
                  ci_id:
                    type: string
                  sources:
                    type: array
                    items:
                      type: object
                      properties:
                        source:
                          type: string
                        discovered_at:
                          type: string
                          format: date-time
                        authority_score:
                          type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  # =============================================================================
  # ANALYTICS
  # =============================================================================
  /analytics/dashboard:
