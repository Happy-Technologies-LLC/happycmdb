apiVersion: v1
kind: Service
metadata:
  name: redis-cluster
  namespace: happycmdb-cmdb
  labels:
    app: redis
spec:
  ports:
    - port: 6379
      targetPort: 6379
      name: client
    - port: 16379
      targetPort: 16379
      name: gossip
  clusterIP: None
  selector:
    app: redis
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
  namespace: happycmdb-cmdb
spec:
  serviceName: redis-cluster
  replicas: 6
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - redis
                topologyKey: kubernetes.io/hostname
      # HAP-1719: requirepass/masterauth reach redis-server through a config file built from the
      # cmdb-secrets redis-password, never through its argv (ps, /proc/<pid>/cmdline).
      volumes:
        - name: redis-auth
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi
      initContainers:
        - name: redis-auth-config
          image: redis:7.2-alpine
          imagePullPolicy: IfNotPresent
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cmdb-secrets
                  key: redis-password
          command:
            - sh
            - -c
            # Every byte becomes a \xHH escape in a double-quoted value, so any password survives
            # Redis config parsing. The value only meets the printf builtin and stdin, never argv.
            - |
              set -eu
              : "${REDIS_PASSWORD:?REDIS_PASSWORD must be set}"
              umask 077
              hex=$(printf '%s' "$REDIS_PASSWORD" | od -An -v -tx1 | tr -d ' \n' | sed 's/../\\x&/g')
              [ -n "$hex" ]
              printf 'requirepass "%s"\nmasterauth "%s"\n' "$hex" "$hex" > "$1"
            - sh
            - /etc/redis-auth/auth.conf
          volumeMounts:
            - name: redis-auth
              mountPath: /etc/redis-auth
      containers:
        - name: redis
          image: redis:7.2-alpine
          imagePullPolicy: IfNotPresent
          env:
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cmdb-secrets
                  key: redis-password
          command:
            - redis-server
          args:
            - /etc/redis-auth/auth.conf
            - --port
            - "6379"
            - --cluster-enabled
            - "yes"
            - --cluster-config-file
            - /data/nodes.conf
            - --cluster-node-timeout
            - "5000"
            - --appendonly
            - "yes"
            - --appendfsync
            - everysec
            - --maxmemory
            - 1gb
            - --maxmemory-policy
            - allkeys-lru
          ports:
            - containerPort: 6379
              name: client
            - containerPort: 16379
              name: gossip
          volumeMounts:
            - name: data
              mountPath: /data
            - name: redis-auth
              mountPath: /etc/redis-auth
              readOnly: true
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "1"
              memory: "1.5Gi"
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                # HAP-1666: password from the container's REDIS_PASSWORD (cmdb-secrets) via env, never argv.
                - REDISCLI_AUTH="$REDIS_PASSWORD" exec redis-cli ping
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                # HAP-1666: password from the container's REDIS_PASSWORD (cmdb-secrets) via env, never argv.
                - REDISCLI_AUTH="$REDIS_PASSWORD" exec redis-cli ping
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: fast-ssd
        resources:
          requests:
            storage: 10Gi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: redis-cluster-init
  namespace: happycmdb-cmdb
data:
  init-cluster.sh: |
    #!/bin/sh
    set -e

    # Wait for all pods to be ready
    sleep 30

    # Get pod IPs
    REDIS_NODES=""
    for i in $(seq 0 5); do
      POD_IP=$(getent hosts redis-$i.redis-cluster.happycmdb-cmdb.svc.cluster.local | awk '{ print $1 }')
      REDIS_NODES="$REDIS_NODES $POD_IP:6379"
    done

    # Create cluster (HAP-1666: password via REDISCLI_AUTH, never argv)
    REDISCLI_AUTH="$REDIS_PASSWORD" redis-cli --cluster create $REDIS_NODES --cluster-replicas 1 --cluster-yes
---
apiVersion: batch/v1
kind: Job
metadata:
  name: redis-cluster-init
  namespace: happycmdb-cmdb
spec:
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: redis-cluster-init
          image: redis:7.2-alpine
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cmdb-secrets
                  key: redis-password
          command:
            - sh
            - -c
          args:
            - |
              sleep 30
              REDIS_NODES=""
              for i in 0 1 2 3 4 5; do
                REDIS_NODES="$REDIS_NODES redis-$i.redis-cluster.happycmdb-cmdb.svc.cluster.local:6379"
              done
              # HAP-1666: password via REDISCLI_AUTH, never argv
              REDISCLI_AUTH="$REDIS_PASSWORD" redis-cli --cluster create $REDIS_NODES --cluster-replicas 1 --cluster-yes
