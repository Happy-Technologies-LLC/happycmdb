services:
  neo4j:
    image: neo4j:5.15-community
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?NEO4J_PASSWORD is required}
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_memory_heap_initial__size: 1G
      NEO4J_dbms_memory_heap_max__size: 1G
      NEO4J_dbms_memory_pagecache_size: 512M
      NEO4J_dbms_security_procedures_unrestricted: apoc.*
      NEO4J_dbms_security_procedures_allowlist: apoc.*
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - neo4j_plugins:/plugins
    healthcheck:
      # HAP-1379: password from the container's NEO4J_AUTH at check time, passed via env (never argv; `$$` defers to the shell).
      test: ["CMD-SHELL", "NEO4J_PASSWORD=\"$${NEO4J_AUTH#*/}\" cypher-shell -u neo4j 'RETURN 1'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  postgres:
    image: timescale/timescaledb:2.13.0-pg16
    environment:
      POSTGRES_DB: cmdb
      POSTGRES_USER: cmdb_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cmdb_user -d cmdb"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    command: ["postgres", "-c", "shared_preload_libraries=timescaledb", "-c", "ssl=off"]
    restart: unless-stopped

  redis:
    image: redis:7.2-alpine
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  api-server:
    image: staging-happycmdb/api-server:${IMAGE_TAG:-local}
    build:
      context: ..
      dockerfile: infrastructure/docker/Dockerfile.api
    depends_on:
      neo4j:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:${HAPPYCMDB_API_PORT:-19000}:3000"
    environment:
      NODE_ENV: production
      # HAP-1091: req.ip = the tailnet client, 2 hops back (operator ruling
      # approvals/operator-ruling-cmdb-hap1091-staging-trust-proxy-20261108T085406Z.go). Chain: tailnet client ->
      # tailscale serve :8449 (overwrites XFF with the peer) -> 127.0.0.1:19080 docker-proxy -> web-ui nginx (appends its
      # remote_addr, the bridge gateway 172.23.0.1) -> api. Any caller reaching nginx through 127.0.0.1:19080, local or
      # via serve, arrives as 172.23.0.1, so 1 hop would key every staging login on that one address.
      # If the :8449 serve mapping is removed, staging is loopback-only: set HAPPYCMDB_TRUST_PROXY=1.
      TRUST_PROXY: ${HAPPYCMDB_TRUST_PROXY:-2}
      PORT: 3000
      STAGING_PUBLIC_URL: ${STAGING_PUBLIC_URL:?STAGING_PUBLIC_URL is required}
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USERNAME: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:?NEO4J_PASSWORD is required}
      NEO4J_SSL_ENABLED: "false"
      NEO4J_ENCRYPTION: "false"
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: cmdb
      # HAP-1562: the API is the NOSUPERUSER, non-owner app login (app-login below); rollback: deploy/BUILD01-STAGING.md.
      POSTGRES_USER: ${POSTGRES_APP_USER:-cmdb_app}
      POSTGRES_PASSWORD: ${POSTGRES_APP_PASSWORD:?POSTGRES_APP_PASSWORD is required}
      POSTGRES_SSL_ENABLED: "off"
      POSTGRES_SSL_MODE: disable
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      KAFKA_BROKERS: ""
      KAFKA_CLIENT_ID: cmdb-api-server
      KAFKA_GROUP_ID: cmdb-api-group
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      AUDIT_CHAIN_KEY: ${AUDIT_CHAIN_KEY:?AUDIT_CHAIN_KEY is required}
      JWT_ISSUER: ${JWT_ISSUER:?JWT_ISSUER is required}
      JWT_AUDIENCE: ${JWT_AUDIENCE:?JWT_AUDIENCE is required}
      BCRYPT_ROUNDS: 10
      CREDENTIAL_ENCRYPTION_KEY: ${ENCRYPTION_KEY:?ENCRYPTION_KEY is required}
      METRICS_SCRAPE_TOKEN: ${METRICS_SCRAPE_TOKEN:-}
      # HAP-1842: every RATE_LIMIT_* the config loader reads (packages/common/src/config/config.loader.ts, rateLimit block),
      # forwarded so the deployer's environment can tune the limiter. Defaults equal the Joi defaults in
      # `configSchema.rateLimit` in packages/common/src/config/config.schema.ts, so an unset deployer environment changes nothing.
      # A changed value needs the api-server container recreated (`up -d --force-recreate api-server`), not restarted.
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
      RATE_LIMIT_BYPASS_HEADER: ${RATE_LIMIT_BYPASS_HEADER:-X-Internal-Service}
      # Empty = bypass off. ConfigurationLoader turns it off (one WARN) for under 32 characters or a shipped placeholder.
      RATE_LIMIT_BYPASS_SECRET: ${RATE_LIMIT_BYPASS_SECRET:-}
      RATE_LIMIT_TIER_STANDARD_MULTIPLIER: ${RATE_LIMIT_TIER_STANDARD_MULTIPLIER:-5}
      RATE_LIMIT_TIER_PREMIUM_MULTIPLIER: ${RATE_LIMIT_TIER_PREMIUM_MULTIPLIER:-10}
      RATE_LIMIT_TIER_ENTERPRISE_MULTIPLIER: ${RATE_LIMIT_TIER_ENTERPRISE_MULTIPLIER:-20}
      RATE_LIMIT_REST_MAX: ${RATE_LIMIT_REST_MAX:-1000}
      RATE_LIMIT_REST_WINDOW_MS: ${RATE_LIMIT_REST_WINDOW_MS:-3600000}
      RATE_LIMIT_GRAPHQL_MAX: ${RATE_LIMIT_GRAPHQL_MAX:-500}
      RATE_LIMIT_GRAPHQL_WINDOW_MS: ${RATE_LIMIT_GRAPHQL_WINDOW_MS:-3600000}
      RATE_LIMIT_HEALTH_MAX: ${RATE_LIMIT_HEALTH_MAX:-0}
      RATE_LIMIT_HEALTH_WINDOW_MS: ${RATE_LIMIT_HEALTH_WINDOW_MS:-60000}
      RATE_LIMIT_AUTH_MAX: ${RATE_LIMIT_AUTH_MAX:-20}
      RATE_LIMIT_AUTH_WINDOW_MS: ${RATE_LIMIT_AUTH_WINDOW_MS:-3600000}
      RATE_LIMIT_AUTH_ACCOUNT_MAX: ${RATE_LIMIT_AUTH_ACCOUNT_MAX:-5}
      RATE_LIMIT_AUTH_ACCOUNT_WINDOW_MS: ${RATE_LIMIT_AUTH_ACCOUNT_WINDOW_MS:-900000}
      RATE_LIMIT_AUTH_ACCOUNT_GLOBAL_MAX: ${RATE_LIMIT_AUTH_ACCOUNT_GLOBAL_MAX:-20}
      RATE_LIMIT_AUTH_ACCOUNT_GLOBAL_WINDOW_MS: ${RATE_LIMIT_AUTH_ACCOUNT_GLOBAL_WINDOW_MS:-900000}
      RATE_LIMIT_DISCOVERY_MAX: ${RATE_LIMIT_DISCOVERY_MAX:-100}
      RATE_LIMIT_DISCOVERY_WINDOW_MS: ${RATE_LIMIT_DISCOVERY_WINDOW_MS:-3600000}
      RATE_LIMIT_ADMIN_MAX: ${RATE_LIMIT_ADMIN_MAX:-200}
      RATE_LIMIT_ADMIN_WINDOW_MS: ${RATE_LIMIT_ADMIN_WINDOW_MS:-3600000}
      RATE_LIMIT_MONITORING_ENABLED: ${RATE_LIMIT_MONITORING_ENABLED:-true}
      RATE_LIMIT_LOG_HITS: ${RATE_LIMIT_LOG_HITS:-true}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/v1/cmdb-health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    restart: unless-stopped

  # HAP-1562: one-shot, as the owner login; creates/re-asserts the API login before every migrator run (045 grants it).
  app-login:
    profiles: ["migrate"]
    image: timescale/timescaledb:2.13.0-pg16
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: cmdb
      PGUSER: cmdb_user
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      APP_LOGIN: ${POSTGRES_APP_USER:-cmdb_app}
      APP_LOGIN_PASSWORD: ${POSTGRES_APP_PASSWORD:?POSTGRES_APP_PASSWORD is required}
    volumes:
      - ./build01-staging-app-login.sql:/hap1562/build01-staging-app-login.sql:ro
      - ../packages/database/src/postgres/migrations/045_staging_app_login_acl.sql:/hap1562/045_staging_app_login_acl.sql:ro
    command: ["psql", "-X", "-f", "/hap1562/build01-staging-app-login.sql"]
    restart: "no"

  migrator:
    profiles: ["migrate"]
    image: staging-happycmdb/api-server:${IMAGE_TAG:-local}
    depends_on:
      postgres:
        condition: service_healthy
      app-login:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: cmdb
      POSTGRES_USER: cmdb_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_SSL_MODE: disable
    command: ["node", "packages/database/dist/postgres/run-migrations.js", "/app/packages/database/src/postgres/migrations"]
    restart: "no"

  web-ui:
    image: staging-happycmdb/web-ui:${IMAGE_TAG:-local}
    build:
      context: ..
      dockerfile: infrastructure/docker/Dockerfile.web
      additional_contexts:
        design-system: ../../happy-technologies-design-system
    depends_on:
      api-server:
        condition: service_healthy
    ports:
      - "127.0.0.1:${HAPPYCMDB_WEB_PORT:-19080}:80"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

volumes:
  neo4j_data:
  neo4j_logs:
  neo4j_plugins:
  postgres_data:
  redis_data:
