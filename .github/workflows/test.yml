name: Test Suite

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: --experimental-vm-modules
    timeout-minutes: 10

    strategy:
      matrix:
        node-version: [22.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run test:unit -- --coverage

      - name: Verify connector wizard schedule deployment
        run: npm run test:run --workspace=@cmdb/web-ui -- --config vitest.connector-wizard.config.ts src/components/connectors/ConnectorDeploySchedule.test.tsx

      - name: Verify web-ui jobs service tenant contract
        run: npm run test:run --workspace=@cmdb/web-ui -- src/services/jobs.service.test.ts

      - name: Upload unit test coverage
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage/unit/lcov.info
          flags: unit
          name: unit-tests

      - name: Upload unit test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-results
          path: test-results/unit/junit.xml

  web-ui-build:
    name: Web UI Build (tsc + vite)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Require private design-system read token
        env:
          DESIGN_SYSTEM_REPO_TOKEN: ${{ secrets.DESIGN_SYSTEM_REPO_TOKEN }}
        run: |
          if [ -z "$DESIGN_SYSTEM_REPO_TOKEN" ]; then
            echo "DESIGN_SYSTEM_REPO_TOKEN missing" >&2
            exit 1
          fi
      - name: Checkout pinned private design system (0.7.3)
        uses: actions/checkout@v4
        with:
          repository: Happy-Technologies-LLC/happy-technologies-design-system
          ref: b58a68c8f7e64171facb72f4657fb1f54212f07d
          token: ${{ secrets.DESIGN_SYSTEM_REPO_TOKEN }}
          persist-credentials: false
          path: happy-technologies-design-system
      - name: Link design system at npm file dependency path
        run: ln -s "$GITHUB_WORKSPACE/happy-technologies-design-system" "$GITHUB_WORKSPACE/../happy-technologies-design-system"
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Typecheck and bundle web UI
        run: npm run build --workspace=web-ui

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      matrix:
        node-version: [22.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run integration tests
        run: npm run test:integration -- --coverage

      - name: Upload integration test coverage
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage/integration/lcov.info
          flags: integration
          name: integration-tests

      - name: Upload integration test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-test-results
          path: test-results/integration/junit.xml

  sec12-02-p99:
    # v16 §15 N-21 SEC12-02 real-store auth p99, 10 vs 5 000 users (operator Choice A and its erratum,
    # approvals/cmdb-pr50-sec12-02-p99-realstore-choice-A*.go). Real HTTP auth path on the integration
    # global setup's disposable Neo4j 5.15 and PostgreSQL. Fails when the median p99 ratio exceeds 1.10
    # (SEC12-02 unmet); in that case the same harness also runs at the PR base, only to classify the cause.
    name: SEC12-02 Auth p99 (real store)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      HARNESS: tests/integration/database/sec12-02-p99.integration.test.ts
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Applies to this PR? (auth request path, harness or this job changed)
        id: scope
        run: |
          set -euo pipefail
          changed=$(git diff --name-only "$BASE_SHA" HEAD -- \
            packages/api-server/src/auth packages/api-server/src/middleware/auth.middleware.ts \
            packages/api-server/src/rest/auth.controller.ts "$HARNESS" .github/workflows/test.yml)
          if [ -n "$changed" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; else echo "run=false" >> "$GITHUB_OUTPUT"; fi
          printf 'Relevant changes:\n%s\n' "${changed:-<none>}"

      - name: Setup Node.js 22.x
        if: steps.scope.outputs.run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'

      - name: Install dependencies
        if: steps.scope.outputs.run == 'true'
        run: npm ci

      - name: Measure at PR head
        if: steps.scope.outputs.run == 'true'
        env:
          SEC12_02_P99: '1'
          P99_LABEL: head
          P99_RESULT_FILE: ${{ github.workspace }}/test-results/sec12-02-p99/head.json
        run: npx jest -c jest.config.integration.js "$HARNESS" --runInBand

      - name: Classify (same harness at the PR base, only when the head ratio exceeds 1.10)
        if: steps.scope.outputs.run == 'true'
        run: |
          set -euo pipefail
          verdict=$(node -p "require('./test-results/sec12-02-p99/head.json').summary.verdict")
          if [ "$verdict" = "PASS" ]; then echo "Head ratio within 1.10; no base run needed."; exit 0; fi
          git worktree add ../p99-base "$BASE_SHA"
          mkdir -p "../p99-base/$(dirname "$HARNESS")"
          cp "$HARNESS" "../p99-base/$HARNESS"
          cd ../p99-base
          npm ci
          SEC12_02_P99=1 P99_LABEL=base P99_RESULT_FILE="$GITHUB_WORKSPACE/test-results/sec12-02-p99/base.json" \
            npx jest -c jest.config.integration.js "$HARNESS" --runInBand

      - name: SEC12-02 verdict
        if: steps.scope.outputs.run == 'true'
        run: |
          node -e '
            const fs = require("fs");
            const read = l => { const f = `test-results/sec12-02-p99/${l}.json`; return fs.existsSync(f) ? JSON.parse(fs.readFileSync(f, "utf8")).summary : null; };
            const head = read("head"), base = read("base");
            console.log("head:", JSON.stringify(head));
            if (base) console.log("base:", JSON.stringify(base));
            const stats = s => `median of per-round ratios ${s.median_of_round_ratios ?? s.ratio}, ratio of medians ${s.ratio_of_medians ?? s.ratio}`;
            if (head.verdict === "PASS") { console.log(`SEC12-02 MET: ${stats(head)}, both <= 1.10`); process.exit(0); }
            const cause = !base ? "unclassified (no base run)"
              : base.verdict === "PASS" ? "INTRODUCED by this PR (base within 1.10)"
              : `PRE-EXISTING scaling also at base (${stats(base)})`;
            console.log(`SEC12-02 UNMET: ${stats(head)} (both must be <= 1.10); cause: ${cause}`);
            process.exit(1);
          '

      - name: Upload SEC12-02 results
        if: always() && steps.scope.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: sec12-02-p99-results
          path: test-results/sec12-02-p99/

  hp1-s1-real-store:
    name: HP1-S1 baseline and real-store acceptance
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      HARNESS: tests/integration/database/hp1-s1-schema.integration.test.ts
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
      - name: Fail-before on the PR base with the same real-store harness
        run: |
          set -euo pipefail
          git worktree add ../hp1-s1-base "$BASE_SHA"
          cp "$HARNESS" "../hp1-s1-base/$HARNESS"
          cd ../hp1-s1-base
          npm ci
          HP1_S1_BASELINE=1 ./node_modules/.bin/jest -c jest.config.integration.js "$HARNESS" --runInBand
      - name: Pass-after on PR head
        run: |
          npm ci
          ./node_modules/.bin/jest -c jest.config.integration.js "$HARNESS" --runInBand

  staging-migrations:
    name: Staging Migration Contract
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
      - name: Prove opt-in profile and migrate disposable empty Postgres
        run: bash deploy/test-staging-migrations.sh

  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      matrix:
        node-version: [22.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run E2E tests
        run: npm run test:e2e

      - name: Upload E2E test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-test-results
          path: test-results/e2e/junit.xml

  test-report:
    name: Generate Test Report
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests, e2e-tests]
    if: always()

    steps:
      - name: Download all test results
        uses: actions/download-artifact@v4
        with:
          path: test-results

      - name: Publish Test Results
        uses: EnricoMi/publish-unit-test-result-action@v2
        continue-on-error: true
        with:
          files: |
            test-results/**/*.xml
          check_name: Test Results
          comment_title: Test Results

  coverage-report:
    name: Coverage Report
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests]
    if: always()

    env:
      NODE_OPTIONS: --experimental-vm-modules
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate combined coverage report
        run: npm run test:coverage

      - name: Upload combined coverage
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage/lcov.info
          flags: combined
          name: combined-coverage

      - name: Comment coverage on PR
        uses: romeovs/lcov-reporter-action@v0.3.1
        continue-on-error: true
        if: github.event_name == 'pull_request'
        with:
          lcov-file: ./coverage/lcov.info
          github-token: ${{ secrets.GITHUB_TOKEN }}

  ci-rollup:
    needs: [unit-tests, integration-tests, e2e-tests, staging-migrations, web-ui-build]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      statuses: write
    steps:
      - name: Publish ci-rollup/test commit status
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.event_name == 'push' && github.sha || '' }} # Push events have no pull_request object, so use github.sha only for pushes.
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          UNIT_TESTS_RESULT: ${{ needs.unit-tests.result }}
          INTEGRATION_TESTS_RESULT: ${{ needs.integration-tests.result }}
          STAGING_MIGRATIONS_RESULT: ${{ needs.staging-migrations.result }}
          E2E_TESTS_RESULT: ${{ needs.e2e-tests.result }}
          WEB_UI_BUILD_RESULT: ${{ needs.web-ui-build.result }}
        run: |
          set -euo pipefail
          if [ -z "$HEAD_SHA" ]; then
            echo "No commit SHA available; skipping ci-rollup/test status."
            exit 0
          fi
          if [ "$UNIT_TESTS_RESULT" = "success" ] &&
             [ "$INTEGRATION_TESTS_RESULT" = "success" ] &&
             [ "$E2E_TESTS_RESULT" = "success" ] &&
             [ "$STAGING_MIGRATIONS_RESULT" = "success" ] &&
             [ "$WEB_UI_BUILD_RESULT" = "success" ]; then
            state=success
            description="all 5 gates passed"
          else
            state=failure
            failures=()
            [ "$UNIT_TESTS_RESULT" = "success" ] || failures+=("unit-tests=$UNIT_TESTS_RESULT")
            [ "$INTEGRATION_TESTS_RESULT" = "success" ] || failures+=("integration-tests=$INTEGRATION_TESTS_RESULT")
            [ "$E2E_TESTS_RESULT" = "success" ] || failures+=("e2e-tests=$E2E_TESTS_RESULT")
            [ "$STAGING_MIGRATIONS_RESULT" = "success" ] || failures+=("staging-migrations=$STAGING_MIGRATIONS_RESULT")
            [ "$WEB_UI_BUILD_RESULT" = "success" ] || failures+=("web-ui-build=$WEB_UI_BUILD_RESULT")
            description="test gates failed: ${failures[*]}"
            if [ "${#description}" -gt 140 ]; then
              description="${description:0:137}..."
            fi
          fi
          gh api "repos/${{ github.repository }}/statuses/${HEAD_SHA}" \
            -f state="$state" \
            -f context="ci-rollup/test" \
            -f description="$description" \
            -f target_url="$RUN_URL"
