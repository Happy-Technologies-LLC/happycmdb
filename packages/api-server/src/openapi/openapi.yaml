          application/json:
            schema:
              type: object
              required: [targetNetworks, provider]
              properties:
                targetNetworks:
                  type: array
                  items:
                    type: string
                    pattern: '^([0-9]{1,3}\.){3}[0-9]{1,3}/[0-9]{1,2}$'
