# =============================================================================
# Grafana Dashboard Provisioning - HappyCMDB
# =============================================================================
# This file automatically provisions all HappyCMDB dashboards when Grafana
# starts. The dashboard JSON directory is bind-mounted at
# /var/lib/grafana/dashboards/cmdb (see infrastructure/docker/docker-compose.yml).
# It must NOT live under /etc/grafana/provisioning: that tree is a :ro bind mount,
# and Docker cannot create a nested mountpoint inside a read-only bind mount.
# All dashboards (data mart and legacy Prometheus ones) sit in that one directory.
# =============================================================================

apiVersion: 1

providers:
  # CMDB Data Mart Dashboards (PostgreSQL/TimescaleDB)
  - name: 'HappyCMDB Dashboards'
    orgId: 1
    folder: 'HappyCMDB'
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards/cmdb
      foldersFromFilesStructure: false
