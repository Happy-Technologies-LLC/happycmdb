                  $ref: '#/components/schemas/DiscoveryDefinition'
        '401':
          $ref: '#/components/responses/Unauthorized'

    post:
      tags: [Discovery]
      summary: Create discovery definition
      description: Create a reusable discovery configuration
      operationId: createDiscoveryDefinition
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDiscoveryDefinitionInput'
            examples:
              aws_discovery:
                summary: AWS connector discovery
                value:
                  name: AWS Production Account Discovery
                  description: Discover all resources in production AWS
                  provider: aws
                  method: connector
                  credential_id: 123e4567-e89b-12d3-a456-426614174000
                  config:
                    regions: [us-east-1, us-west-2]
                    services: [ec2, rds, lambda, s3]
                  schedule: "0 */6 * * *"
                  is_active: true
                  tags: [aws, production]
              nmap_discovery:
                summary: NMAP network scan
                value:
                  name: Production Network Scan
                  description: Scan production subnet for devices
                  provider: nmap
                  method: agent
                  agent_id: agent-prod-01
                  config:
                    target_networks: ["10.0.0.0/24"]
                    scan_type: comprehensive
                  schedule: "0 2 * * *"
                  is_active: true
      responses:
        '201':
          description: Definition created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiscoveryDefinition'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

